  function items() {
    var src = state.seg === 'skill' ? SKILLS : MCPS;
    var list = src.filter(function (it) {
      if (state.cat === '推荐') { if (!it[8]) return false; }
      else if (it[3] !== state.cat) return false;

        var hay = (it[0] + ' ' + it[1] + ' ' + it[2]).toLowerCase();
        if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
      }
      return true;

    var key = { stars: 4, new: 5, rating: 6 }[state.sort];
    return list.sort(function (a, b) {

  /* ---- 分段切换 ---- */
  Array.prototype.forEach.call(document.querySelectorAll('[data-seg]'), function (t) {
    t.addEventListener('click', function () {
      state.seg = t.getAttribute('data-seg');
      Array.prototype.forEach.call(document.querySelectorAll('[data-seg]'), function (x) {
        var on = x === t;
        x.classList.toggle('active', on);
        x.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      qInput.placeholder = state.seg === 'skill' ? '搜索 Skill…' : '搜索 MCP…';
      render();
    });
  });
  /* ---- 分类 / 排序 / 搜索 ---- */
  Array.prototype.forEach.call(document.querySelectorAll('[data-cat]'), function (t) {
    t.addEventListener('click', function () {
      state.cat = t.getAttribute('data-cat');
      Array.prototype.forEach.call(document.querySelectorAll('[data-cat]'), function (x) { x.classList.toggle('active', x === t); });
      render();
    });
  });
  document.querySelector('[data-store-sort]').addEventListener('change', function () { state.sort = this.value; render(); });
  qInput.addEventListener('input', function () { state.q = this.value.trim(); render(); });

  /* ---- 安装弹层：选助手 → 进度 → 成功 ---- */
  function openPop(it) {
    var agents = myAgents();
    popBody.innerHTML = '<div class="pop-title">把「' + it[0] + '」装到哪些助手？</div>'
      + '<div class="pop-sub">默认全选你已装的助手，装完立即可用。'
      + (it[9] ? '这个' + (state.seg === 'skill' ? ' Skill' : ' MCP') + '需要 API Key，装完会提示你填。' : '') + '</div>'
      + '<div class="pop-list">' + agents.map(function (a) {
        var f = LOGOS[a] || a;
        return '<label class="pop-row"><img' + (BLACK[f] ? ' class="logo-invert"' : '') + ' src="logos/' + f + '.svg" alt="' + NAMES[a] + '">' + NAMES[a]
          + '<input type="checkbox" checked data-pop-agent="' + a + '"></label>';
      }).join('') + '</div>'
      + '<div class="pop-foot"><button class="btn-ghost btn btn-sm" data-pop-cancel>取消</button>'
      + '<button class="btn btn-sm" data-pop-go>安装到 ' + agents.length + ' 个助手</button></div>';
    mask.hidden = false;
    var goBtn = popBody.querySelector('[data-pop-go]');
    popBody.querySelectorAll('[data-pop-agent]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var n = popBody.querySelectorAll('[data-pop-agent]:checked').length;
        goBtn.textContent = n ? '安装到 ' + n + ' 个助手' : '至少选一个助手';
        goBtn.disabled = !n;
      });
    });
    popBody.querySelector('[data-pop-cancel]').addEventListener('click', closePop);
    goBtn.addEventListener('click', function () {
      var n = popBody.querySelectorAll('[data-pop-agent]:checked').length;
      runInstall(it, n);
    });
  }
  function runInstall(it, n) {
    popBody.innerHTML = '<div class="pop-center"><div class="pop-title">正在安装「' + it[0] + '」</div>'
      + '<div class="install-progress"><div class="install-track"><div class="install-bar" data-bar></div></div>'
      + '<div class="install-step" data-step>下载中…</div></div></div>';
    var bar = popBody.querySelector('[data-bar]');
    var step = popBody.querySelector('[data-step]');
    var steps = [[0, '下载中…', 32], [600, '安全扫描…', 66], [1200, state.seg === 'skill' ? '写入助手目录…' : '写入助手配置…', 100]];
    steps.forEach(function (s) {
      setTimeout(function () { step.textContent = s[1]; bar.style.width = s[2] + '%'; }, s[0]);
    });
    setTimeout(function () {
      installedNames[it[0]] = 1;
      saveInstalled();
      popBody.innerHTML = '<div class="pop-center"><div class="install-done-icon">' + ICON_CHECK + '</div>'
        + '<div class="pop-title">「' + it[0] + '」装好了</div>'
        + '<div class="pop-sub">已装到 ' + n + ' 个助手，去「已安装」页就能看到。'
        + (it[9] ? '记得在那里填上 API Key。' : '') + '</div></div>';
      render();
      setTimeout(closePop, 1100);
    }, 1900);
  }
  function closePop() { mask.hidden = true; }
  mask.addEventListener('click', function (e) { if (e.target === mask) closePop(); });

  /* ---- 卡片点击：安装按钮进弹层；Skill 卡片本体进详情页 ---- */
  grid.addEventListener('click', function (e) {
    var installBtn = e.target.closest('[data-install]');
    if (installBtn) {
      var src = state.seg === 'skill' ? SKILLS : MCPS;
      var it = src.filter(function (x) { return x[0] === installBtn.getAttribute('data-install'); })[0];
      if (it) openPop(it);
      return;
    }
    var card = e.target.closest('.card.is-link');
    if (card) location.href = 'skill.html?name=' + encodeURIComponent(card.dataset.name) + '&type=' + state.seg + '&from=store';
  });

  /* 分段计数 + 首次渲染 */
  document.querySelector('[data-seg-count="skill"]').textContent = SKILLS.length;
  document.querySelector('[data-seg-count="mcp"]').textContent = MCPS.length;
  render();
})();
</script>
</body>
</html>
