# 市场数据定时同步：跑管线 → 有变化才提交本仓库（官网自动重建）
# → 配了数据仓库则同步推送（桌面端海外分发源）。
#
# 开箱状态：只跑前两步（本仓库数据刷新）即生效。
# 接入数据仓库：GitHub 仓库 Settings → Secrets and variables → Actions 里配：
#   Variables: REGISTRY_REPO（本项目为 shunFSKi/yo-skill-registry）
#   Secrets:   REGISTRY_TOKEN（对数据仓有写权限的 PAT）
# Gitee 国内镜像不在此推送：数据仓已通过 Gitee 官方镜像功能单向 Pull，
# GitHub 数据仓上配了 push webhook 自动触发 Gitee 同步（2026-08-14 配通）。
# 注意：Gitee 处理 pull 常超 GitHub 10s 投递超时，投递记录显示 500 但同步实际会执行；
# 兜底：镜像管理页点「更新」，或手动 POST remote_mirror/pull?access_token=<Gitee令牌>。
# 详见 tools/registry-pipeline/README.md

name: registry-sync

on:
  schedule:
    # 每天 UTC 03:17 / 15:17（北京时间 11:17 / 23:17），避开整点拥堵
    - cron: "17 3,15 * * *"
  workflow_dispatch: # 手动触发

permissions:
  contents: write # 回推本仓库用

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本读根 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 跑管线刷新 apps/web/public/registry
        # 直接 node 跑，不走 pnpm 脚本：pnpm 11 在 CI 会先 "Recreating node_modules"
        #（verify-deps 重建）然后空跑退出 0，脚本根本没执行（2026-08-14 实测踩坑）。
        # 依赖解析不受影响：pnpm install 后包内 node_modules 软链已就位。
        run: node tools/registry-pipeline/src/index.ts
        env:
          # GitHub 全量采集用（代码搜索 API 必须登录）；未配置则自动跳过该源
          GITHUB_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      - name: 有变化才提交本仓库
        run: |
          if [ -z "$(git status --porcelain apps/web/public/registry)" ]; then
            echo "数据无变化，不提交"
            exit 0
          fi
          git config user.name "yo-skill-bot"
          git config user.email "yo-skill-bot@users.noreply.github.com"
          git add apps/web/public/registry
          git commit -s -m "chore(registry): 定时刷新市场数据"
          # 管线要跑约 2 小时，期间人工推送会抢占 main（2026-08-14 实测撞车：
          # 数据 commit 已生成但 push 被 fetch first 拒绝，后续数据仓/Gitee 步全部跳过）。
          # 推送前先 rebase 到最新 main，冲突概率极低（人工改动几乎不碰 registry 目录）。
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push 失败，第 $i 次重试"
            sleep 5
          done
          exit 1

      - name: 检出数据仓库（未配置则跳过）
        if: vars.REGISTRY_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REGISTRY_REPO }}
          token: ${{ secrets.REGISTRY_TOKEN }}
          path: registry-data

      - name: 同步并推送数据仓库
        if: vars.REGISTRY_REPO != ''
        env:
          REGISTRY_REPO: ${{ vars.REGISTRY_REPO }}
        run: |
          # 必须排除 .git：--delete 会删掉数据仓自身的 .git，后续 git 命令会上溯到主仓
          rsync -a --delete --exclude='.git' apps/web/public/registry/ registry-data/
          cd registry-data
          # 兜底：确认身处数据仓而非主仓，防止污染主仓库
          git remote get-url origin | grep -q "$REGISTRY_REPO" || { echo "::error::不在数据仓库内，中止"; exit 1; }
          if [ -z "$(git status --porcelain)" ]; then
            echo "数据仓库无变化，不提交"
            exit 0
          fi
          git config user.name "yo-skill-bot"
          git config user.email "yo-skill-bot@users.noreply.github.com"
          git add -A
          git commit -s -m "chore: registry 数据刷新 $(date -u +%F)"
          git push

      - name: 触发 Gitee 镜像同步（配了才执行）
        # 为什么不用 GitHub webhook 通知 Gitee：2 万+ 文件的 push payload 巨大，
        # Gitee 接收慢于 GitHub 10s 投递超时 → 永远假失败（2026-08-14 两次实测）。
        # 改为 CI 里直接 curl Gitee API（无 body，秒回 204，同步异步执行）。webhook 留作兜底。
        if: vars.REGISTRY_REPO != ''
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then echo "未配置 GITEE_TOKEN，跳过 Gitee 同步"; exit 0; fi
          curl -s -X POST "https://gitee.com/api/v5/repos/shunFSKi/yo-skill-registry/remote_mirror/pull?access_token=$GITEE_TOKEN" \
            -w "gitee mirror pull: HTTP %{http_code}\n"
